[package]
name = "ToDay"
version = "0.1.0"
edition = "2024"

[lib]
# 桌面是普通库 + 可执行文件；Android 的入口是 `android_main`，
# 由 `cdylib`（`libToDay.so`）交给 Gradle 打进 APK，manifest 的 lib_name 认的也是这个名字。
crate-type = ["lib", "cdylib"]

[dependencies]
# 界面：eframe 起窗口，egui 画界面（ui 层只依赖后者）
eframe = "0.36.2"
egui = "0.36.2"

# 加密：Argon2id 派生密钥，ChaCha20-Poly1305 逐字段加密
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1.9"
rand = "0.8"

# 存储：bundled 自带 SQLite 源码，不依赖系统里装没装
rusqlite = { version = "0.32", features = ["bundled"] }

# 日期与平台路径
chrono = "0.4"
directories = "6"

# 错误：库层用 thiserror，只有 main 汇报错误用 anyhow
thiserror = "2"
anyhow = "1"

# Android：eframe 靠 game-activity 起窗口（默认的 accesskit 只跟它兼容，
# 见 eframe 的 compile_error），`persistence` 只为拿到切后台时的 `App::save` 钩子，
# 它写出来的 `app.ron` 永远是空的（`persist_egui_memory` 返回 false）。
# winit 不在 eframe 的再导出里，而 `android_main` 的入参 `AndroidApp` 是它的类型，
# 输入法快照也是通过它拿的（见 `src/android.rs`）。
# Android 上 eprintln! 进不了 logcat，日志走 `log` + `android_logger`。
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36.2", features = ["android-game-activity", "persistence"] }
winit = "0.30.13"
android_logger = "0.15"
log = "0.4"
# 读 game-activity 的文本状态：`jni` 取 AGDK 的 native handle，`simd_cesu8` 解它给的
# modified UTF-8（BMP 之外的字在标准 UTF-8 里解不出来）。两个都已是依赖树里的版本。
jni = "0.22"
simd_cesu8 = "1"

[dev-dependencies]
tempfile = "3"

# 日常用 `cargo run`，跑的是 debug 构建：依赖里的字形光栅化（vello_cpu）、排版（harfrust）
# 与 wgpu 在未优化下慢一个数量级，解锁与打字时都感受得到。依赖恒定开 3，自有 crate 只开 1，
# 重编自己的代码还是秒级。改完这一段第一次 `cargo test` / `cargo clippy` 会重编全部依赖。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# 交给用户的构建：体积与跨 crate 内联各让一步，不追求极限编译时间
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
